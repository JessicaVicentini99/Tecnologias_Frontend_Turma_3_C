<!DOCTYPE html>
<html>
    <head>
        <title>Loja</title>
        <meta charset="UTF-8">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <script src="config.js"></script>
    </head>
    <body class="bg-light">
        <div class="container mt-5">
            <!-- Formulario -->
            <div class="card shadow mb-3">
                <div class="card-body">
                    <h3 class="card-title">Hortifruti</h3>
                    <form id="formulario">
                        <div class="mb-3">
                            <label class="form-label" for="nome">Nome produto</label>
                            <input id="nome" class="form-control" type="text" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="preco">Preço</label>
                            <input id="preco" class="form-control" type="number" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="quantidade">Quantidade</label>
                            <input id="quantidade" class="form-control" type="number" required>
                        </div>
                        <button type="submit" class="btn btn-primary">
                            Criar Produto
                        </button>
                    </form>
                </div>
            </div>
            <div class="card shadow">
                <div class="card-body">
                    <h3 class="card-title">Listagem</h3>
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>Preço</th>
                                <th>Quantidade</th>
                                <th>ID</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </body>
</html>
<script>
    const BASE_URL = `https://api.restful-api.dev/collections/${CONFIG.COLLECTION}/objects`
    //Criando cliente do axios, ja configurado
    const api = axios.create({
        baseURL: BASE_URL,
        headers: {
            "x-api-key": CONFIG.TOKEN,
            "Content-Type": "application/json"
        }
    })

    let formulario = document.getElementById("formulario")

    formulario.addEventListener("submit", async function(e) {
        e.preventDefault()
        console.log("TESTE")

        let nome = document.getElementById("nome").value
        let preco = document.getElementById("preco").value
        let quantidade = document.getElementById("quantidade").value

        let corpo = {
            name: nome,
            data: {
                price: preco,
                quantity: quantidade
            }
        }
        
        try {
            let resposta = await api.post("", corpo)
            alert(`Produto criado com sucesso: ${resposta.data.id}`)
        } catch (erro) {
            console.log(erro)
            alert(`Erro: ${erro.response.data}`)
        }
    })
</script>
